name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  # Must match "builtin-baseline" in vcpkg.json (vcpkg tag 2026.10.16).
  VCPKG_COMMIT: 9eec002df1cd109f8f104cd966a763daf9751489
  CLANG_TOOLS_VERSION: "19"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            preset: windows-msvc
            qt-arch: win64_msvc2022_64
            vcpkg-cache: windows
          - name: macos
            os: macos-15
            preset: macos-clang
            qt-arch: clang_64
            vcpkg-cache: macos
          - name: linux-gcc
            os: ubuntu-24.04
            preset: linux-gcc
            qt-arch: linux_gcc_64
            vcpkg-cache: linux
          - name: linux-clang
            os: ubuntu-24.04
            preset: linux-clang
            qt-arch: linux_gcc_64
            vcpkg-cache: linux
            clang-tidy: true

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - name: Check out femapp
        uses: actions/checkout@v5

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config curl zip unzip tar \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxi-dev libxmu-dev \
            libxkbcommon-dev libfontconfig1-dev libdbus-1-3

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - name: Set up the MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          modules: qtshadertools
          cache: true

      - name: Check out vcpkg at the pinned baseline
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg

      # ilammy/msvc-dev-cmd exports VCPKG_ROOT pointing at the copy bundled with
      # Visual Studio, which overrides the job-level value. Pin it back.
      - name: Point VCPKG_ROOT at the pinned checkout
        shell: pwsh
        run: |
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap vcpkg
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          if ($IsWindows) {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          } else {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          }
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.vcpkg-cache }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.vcpkg-cache }}-

      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }} "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }}

      # REQ-001-27: OpenCASCADE (LGPL) must be linked as a shared library.
      - name: Check that OpenCASCADE is linked dynamically
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.preset }}/bin/test_geom"
          if ($IsWindows) {
            $deps = dumpbin /dependents "$exe.exe"
          } elseif ($IsMacOS) {
            $deps = otool -L $exe
          } else {
            $deps = ldd $exe
          }
          $deps
          if (-not ($deps | Select-String -SimpleMatch 'TKernel')) {
            throw "test_geom does not depend on a shared TKernel library"
          }

      # REQ-001-24: static analysis, on one configuration only.
      - name: Run clang-tidy
        if: matrix.clang-tidy
        run: |
          sudo apt-get install -y --no-install-recommends clang-tidy-${CLANG_TOOLS_VERSION}
          run-clang-tidy-${CLANG_TOOLS_VERSION} -quiet \
            -clang-tidy-binary clang-tidy-${CLANG_TOOLS_VERSION} \
            -p build/${{ matrix.preset }} \
            "${PWD}/src/.*\.cpp$" "${PWD}/tests/.*\.cpp$"

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out femapp
        uses: actions/checkout@v5

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_TOOLS_VERSION}.1.5"

      # REQ-001-24: formatting must match .clang-format.
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp' \
            | xargs clang-format --dry-run --Werror
